<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0072B2"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E69F00"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#009E73"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#D55E00"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="white"/>

  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#333">
    Who Can Reach the Camera?
  </text>

  <!-- Center: Camera -->
  <circle cx="400" cy="300" r="50" fill="#F0F0F0" stroke="#333" stroke-width="2"/>
  <text x="400" y="305" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#333">
    Camera
  </text>

  <!-- TOP LEFT: Physical/USB Access -->
  <rect x="40" y="80" width="120" height="80" fill="#FFE8CC" stroke="#E69F00" stroke-width="2" rx="4"/>
  <text x="100" y="105" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#333">
    Physical Access
  </text>
  <text x="100" y="125" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#555">
    USB cable
  </text>
  <text x="100" y="142" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#555">
    Unlocked bootloader
  </text>
  <!-- Arrow from Physical to Camera -->
  <line x1="160" y1="120" x2="340" y2="280" stroke="#E69F00" stroke-width="2.5" marker-end="url(#arrowhead-orange)"/>
  <text x="235" y="190" font-size="10" font-family="sans-serif" fill="#E69F00" font-weight="bold">
    Flash custom kernel
  </text>

  <!-- TOP CENTER: Installer Wi-Fi -->
  <rect x="300" y="60" width="200" height="100" fill="#E8F4F8" stroke="#0072B2" stroke-width="2" rx="4"/>
  <text x="400" y="90" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#333">
    Installer Wi-Fi Access Point
  </text>
  <text x="400" y="110" font-size="10" text-anchor="middle" font-family="sans-serif" fill="#555">
    SSID: Flock-XXXXXX
  </text>
  <text x="400" y="127" font-size="10" text-anchor="middle" font-family="sans-serif" fill="#555">
    Hardcoded WPA2 key
  </text>
  <text x="400" y="144" font-size="10" text-anchor="middle" font-family="sans-serif" fill="#555">
    Unauthenticated control server (port 8080)
  </text>
  <!-- Arrow from Wi-Fi to Camera -->
  <line x1="400" y1="160" x2="400" y2="240" stroke="#0072B2" stroke-width="2.5" marker-end="url(#arrowhead-blue)"/>
  <text x="440" y="210" font-size="10" font-family="sans-serif" fill="#0072B2" font-weight="bold">
    Enable ADB, reboot,
  </text>
  <text x="465" y="225" font-size="10" font-family="sans-serif" fill="#0072B2" font-weight="bold">
    steal database
  </text>

  <!-- TOP RIGHT: Backend Service -->
  <rect x="640" y="80" width="120" height="80" fill="#E8F0E8" stroke="#009E73" stroke-width="2" rx="4"/>
  <text x="700" y="105" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#333">
    Backend Service
  </text>
  <text x="700" y="125" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#555">
    No TLS pinning
  </text>
  <text x="700" y="142" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#555">
    Cloud API access
  </text>
  <!-- Arrow from Backend to Camera -->
  <line x1="640" y1="120" x2="440" y2="280" stroke="#009E73" stroke-width="2.5" marker-end="url(#arrowhead-green)"/>
  <text x="540" y="190" font-size="10" font-family="sans-serif" fill="#009E73" font-weight="bold">
    Change settings,
  </text>
  <text x="535" y="205" font-size="10" font-family="sans-serif" fill="#009E73" font-weight="bold">
    keep Wi-Fi on
  </text>

  <!-- BOTTOM LEFT: Other Apps on Device -->
  <rect x="40" y="420" width="140" height="100" fill="#FFE8E8" stroke="#D55E00" stroke-width="2" rx="4"/>
  <text x="110" y="450" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#333">
    Other Apps
    on Device
  </text>
  <text x="110" y="475" font-size="10" text-anchor="middle" font-family="sans-serif" fill="#555">
    Camera service (ciroc)
  </text>
  <text x="110" y="493" font-size="10" text-anchor="middle" font-family="sans-serif" fill="#555">
    ALPR database copy
  </text>
  <text x="110" y="511" font-size="10" text-anchor="middle" font-family="sans-serif" fill="#555">
    Auth token theft
  </text>
  <!-- Arrow from Apps to Camera -->
  <line x1="160" y1="480" x2="340" y2="330" stroke="#D55E00" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>
  <text x="235" y="410" font-size="10" font-family="sans-serif" fill="#D55E00" font-weight="bold">
    No permissions
    required
  </text>

  <!-- BOTTOM RIGHT: Root Access -->
  <rect x="620" y="420" width="140" height="100" fill="#FFD9D9" stroke="#CC0000" stroke-width="2" rx="4"/>
  <text x="690" y="450" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#333">
    Local Root
    Escalation
  </text>
  <text x="690" y="475" font-size="10" text-anchor="middle" font-family="sans-serif" fill="#555">
    World-writable command
  </text>
  <text x="690" y="493" font-size="10" text-anchor="middle" font-family="sans-serif" fill="#555">
    socket (reaperd)
  </text>
  <text x="690" y="511" font-size="10" text-anchor="middle" font-family="sans-serif" fill="#555">
    Full system control
  </text>
  <!-- Arrow from Root to Camera -->
  <line x1="620" y1="470" x2="450" y2="330" stroke="#CC0000" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>
  <text x="530" y="390" font-size="10" font-family="sans-serif" fill="#CC0000" font-weight="bold">
    Complete access
  </text>

  <!-- Legend -->
  <text x="50" y="570" font-size="11" font-family="sans-serif" fill="#666">
    <tspan font-weight="bold">Key findings:</tspan>
  </text>
  <text x="50" y="590" font-size="10" font-family="sans-serif" fill="#555">
    Device runs as system UID with test-signed bootloader. All these paths bypass authentication.
  </text>
</svg>
