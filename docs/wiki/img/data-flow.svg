<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <style>
      .box { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .device-box { fill: #e8f4f8; stroke: #0277bd; stroke-width: 2; }
      .cloud-box { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
      .alert-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; }
      .label { font-family: sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
      .label-small { font-family: sans-serif; font-size: 12px; fill: #666; text-anchor: middle; }
      .section-title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #0277bd; text-anchor: middle; }
      .section-title-cloud { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #f57c00; text-anchor: middle; }
      .arrow { fill: none; stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .data-flow { fill: none; stroke: #666; stroke-width: 2; stroke-dasharray: 4,4; marker-end: url(#arrowhead-data); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-data" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>

  <!-- Background sections -->
  <rect x="20" y="20" width="440" height="610" fill="#f0f7ff" opacity="0.3" stroke="#0277bd" stroke-width="1" stroke-dasharray="4,4" rx="5"/>
  <text x="80" y="50" class="section-title">ON-DEVICE (Camera)</text>

  <rect x="540" y="20" width="440" height="610" fill="#fff8f0" opacity="0.3" stroke="#f57c00" stroke-width="1" stroke-dasharray="4,4" rx="5"/>
  <text x="760" y="50" class="section-title-cloud">IN THE CLOUD</text>

  <!-- Step 1: Car &amp; Camera -->
  <g>
    <!-- Car -->
    <rect x="40" y="90" width="60" height="35" fill="#cccccc" stroke="#333" stroke-width="2" rx="3"/>
    <circle cx="55" cy="130" r="6" fill="#333"/>
    <circle cx="85" cy="130" r="6" fill="#333"/>
    <text x="72" y="115" class="label-small">Car</text>
  </g>

  <!-- Arrow: car moving -->
  <path d="M 110 115 L 150 115" class="arrow"/>

  <!-- Step 2: Camera Captures -->
  <g>
    <rect x="150" y="85" width="120" height="55" class="device-box" rx="4"/>
    <text x="210" y="110" class="label">1. Capture</text>
    <text x="210" y="128" class="label-small">Camera streams video</text>
  </g>

  <!-- Arrow down -->
  <path d="M 210 140 L 210 180" class="arrow"/>

  <!-- Step 3: Detect &amp; Localize -->
  <g>
    <rect x="150" y="180" width="120" height="75" class="device-box" rx="4"/>
    <text x="210" y="205" class="label">2. Detect &amp; Localize</text>
    <text x="210" y="223" class="label-small">Find plate location</text>
    <text x="210" y="238" class="label-small">Calculate quality score</text>
    <text x="210" y="253" class="label-small">(On-device ML)</text>
  </g>

  <!-- Arrow down -->
  <path d="M 210 255 L 210 290" class="arrow"/>

  <!-- Step 4: Track &amp; Score -->
  <g>
    <rect x="150" y="290" width="120" height="75" class="device-box" rx="4"/>
    <text x="210" y="315" class="label">3. Track &amp; Score</text>
    <text x="210" y="333" class="label-small">Select best frame</text>
    <text x="210" y="348" class="label-small">Create crop image</text>
    <text x="210" y="363" class="label-small">+ metadata</text>
  </g>

  <!-- Arrow down -->
  <path d="M 210 365 L 210 400" class="arrow"/>

  <!-- Step 5: Prepare Upload -->
  <g>
    <rect x="150" y="400" width="120" height="75" class="device-box" rx="4"/>
    <text x="210" y="425" class="label">4. Prepare Data</text>
    <text x="210" y="443" class="label-small">Crop image</text>
    <text x="210" y="458" class="label-small">Location (GPS)</text>
    <text x="210" y="473" class="label-small">Detection metadata</text>
  </g>

  <!-- Arrow: Upload to Cloud -->
  <path d="M 280 438 Q 410 438 540 440" class="arrow" stroke="#ff8c00" stroke-width="2.5"/>
  <text x="410" y="425" class="label-small" fill="#ff8c00">Upload via cellular</text>

  <!-- Step 6: Cloud Receives -->
  <g>
    <rect x="560" y="90" width="130" height="75" class="cloud-box" rx="4"/>
    <text x="625" y="115" class="label">5. Receive Data</text>
    <text x="625" y="133" class="label-small">Crop image</text>
    <text x="625" y="148" class="label-small">Metadata &amp; location</text>
  </g>

  <!-- Arrow down -->
  <path d="M 625 165 L 625 200" class="arrow"/>

  <!-- Step 7: OCR -->
  <g>
    <rect x="560" y="200" width="130" height="75" class="cloud-box" rx="4"/>
    <text x="625" y="225" class="label">6. Read Plate Text</text>
    <text x="625" y="243" class="label-small">OCR analysis</text>
    <text x="625" y="258" class="label-small">Convert image → text</text>
    <text x="625" y="273" class="label-small">(Cloud-side)</text>
  </g>

  <!-- Arrow down -->
  <path d="M 625 275 L 625 310" class="arrow"/>

  <!-- Step 8: Watchlist Match -->
  <g>
    <rect x="560" y="310" width="130" height="75" class="cloud-box" rx="4"/>
    <text x="625" y="335" class="label">7. Check Watchlist</text>
    <text x="625" y="353" class="label-small">Compare plate text</text>
    <text x="625" y="368" class="label-small">against known plates</text>
    <text x="625" y="383" class="label-small">(wanted list)</text>
  </g>

  <!-- Arrow down -->
  <path d="M 625 385 L 625 420" class="arrow"/>

  <!-- Step 9: Generate Alert -->
  <g>
    <rect x="560" y="420" width="130" height="75" class="alert-box" rx="4"/>
    <text x="625" y="445" class="label" fill="#2e7d32">8. Alert</text>
    <text x="625" y="463" class="label-small" fill="#2e7d32">Match found</text>
    <text x="625" y="478" class="label-small" fill="#2e7d32">Generate notification</text>
    <text x="625" y="493" class="label-small" fill="#2e7d32">to operator</text>
  </g>

  <!-- Legend / Key -->
  <g>
    <rect x="40" y="550" width="320" height="70" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="50" y="570" class="label" text-anchor="start" font-weight="bold">Key:</text>
    
    <rect x="50" y="578" width="12" height="12" class="device-box"/>
    <text x="68" y="587" class="label-small" text-anchor="start">On-device processing</text>
    
    <rect x="260" y="578" width="12" height="12" class="cloud-box"/>
    <text x="278" y="587" class="label-small" text-anchor="start">Cloud processing</text>
    
    <rect x="50" y="598" width="12" height="12" class="alert-box"/>
    <text x="68" y="607" class="label-small" text-anchor="start">Alert / Output</text>
  </g>

  <!-- Bottom note -->
  <text x="500" y="600" class="label-small" text-anchor="middle">Crop image and metadata travel to cloud; plate text is recognized in cloud, not on device</text>

</svg>
